version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: verilab_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: verilab_dev
      POSTGRES_USER: verilab
      POSTGRES_PASSWORD: verilab_dev_password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U verilab -d verilab_dev"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ../../backend
      dockerfile: Dockerfile
    container_name: verilab_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://verilab:verilab_dev_password@postgres:5432/verilab_dev
      SECRET_KEY: dev_only_change_in_production
      ALLOWED_ORIGINS: "http://localhost:5173,http://127.0.0.1:5173"
      MAX_UPLOAD_BYTES: "10485760"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ../../backend:/app
      - /app/venv  # exclude venv from bind mount

  frontend:
    image: node:20-alpine
    container_name: verilab_frontend
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host"
    ports:
      - "5173:5173"
    environment:
      VITE_API_BASE_URL: http://localhost:8000
    volumes:
      - ../../frontend:/app
    depends_on:
      - backend

volumes:
  pgdata:
    driver: local
