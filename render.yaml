# Render Blueprint: Dashboard → New → Blueprint → pick this repo. See DEPLOY.md.
# Free setup: backend only on Render. The website is a Cloudflare Worker, the
# database (and uploaded files, STORAGE_BACKEND=db) on Neon, and a Cloudflare
# Worker (infrastructure/cloudflare/keepalive) keeps this service from sleeping.
# To use Cloudflare R2 for files instead: set STORAGE_BACKEND=r2 and the R2_* vars.
# Synthetic demo data only. Not for real patient data (see AUDIT.md).
services:
  - type: web
    name: verilab-api
    runtime: python
    rootDir: backend
    plan: free
    # Install packages, then download and load the OCR models once at build time,
    # so the first upload doesn't wait for (or fail on) the model download.
    buildCommand: pip install -r requirements.txt && python -c "from services.ocr_service import warm_up; warm_up()"
    startCommand: alembic upgrade head && uvicorn main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips='*'
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: ENVIRONMENT
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: OCR_PROVIDER
        value: rapidocr
      - key: STORAGE_BACKEND
        value: db
      - key: MAX_UPLOAD_BYTES
        value: "10485760"
      # Set these in the dashboard when Render asks (see DEPLOY.md):
      - key: DATABASE_URL          # Neon connection string
        sync: false
      - key: ALLOWED_ORIGINS       # your website URL, e.g. https://verilab.<you>.workers.dev
        sync: false
      - key: DEMO_USER_PASSWORD    # strong password for the 4 demo logins
        sync: false
