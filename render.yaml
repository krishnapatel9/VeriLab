# Render Blueprint: Dashboard → New → Blueprint → pick this repo.
# Synthetic demo data only. Not for real patient data (see AUDIT.md).
databases:
  - name: verilab-db
    databaseName: verilab
    user: verilab
    plan: basic-256mb

services:
  - type: web
    name: verilab-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: starter            # a persistent disk needs a paid instance
    healthCheckPath: /health
    disk:
      name: uploads
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: verilab-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: OCR_PROVIDER
        value: tesseract
      - key: STORAGE_DIR
        value: /var/data/uploads
      - key: MAX_UPLOAD_BYTES
        value: "10485760"
      # Set these two in the dashboard:
      - key: ALLOWED_ORIGINS       # e.g. https://verilab-web.onrender.com
        sync: false
      - key: DEMO_USER_PASSWORD    # strong password for the 4 demo logins; leave empty for none
        sync: false

  - type: web
    name: verilab-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL     # e.g. https://verilab-api.onrender.com
        sync: false
